[project]
name = "facemask"
version = "0.1.0"
description = "Face-mask detection with YOLOv8: data audit, leakage check and held-out re-evaluation of an earlier model"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["data: needs the downloaded Kaggle dataset (skipped when absent)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
